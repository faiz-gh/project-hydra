[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crdblab"
version = "0.1.0"
description = "Measurement harness for a multi-cloud CockroachDB vs PostgreSQL/Patroni testbed"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
crdblab = "crdblab.cli:main"

[tool.setuptools.packages.find]
include = ["crdblab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
