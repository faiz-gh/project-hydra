# Profile for the dissertation sweep. Copied verbatim into every run manifest.
name: thesis

workload:
  generator: ycsb            # a kv read cannot reach rows loaded by another process
  ycsb_workload: CUSTOM      # 80/20 read/update mix below
  read_freq: 0.8
  update_freq: 0.2
  request_distribution: uniform  # CUSTOM defaults to zipfian (a hot subset)
  read_percent: 80           # kv only
  duration_s: 60
  warmup_s: 5                # discarded: connection ramp-up is not steady state
  display_every_s: 1
  concurrencies: [10, 50, 100, 200]
  repetitions: 3             # three runs permit interval estimates
  randomise_tier_order: true # controls for drift across the sweep
  cooldown_s: 15             # lets range rebalancing quiesce between tiers

  # 3.75M rows ~= 6.15 GB, ~1.5x node RAM, so the sweep is disk-bound. Needs
  # sized disks on every node and ~70-110 min to load on PostgreSQL.

  # seed and insert_count MUST match the values the table was loaded with, or
  # every lookup silently matches zero rows.
  seed: 42
  insert_count: 3750000
  cycle_length: 1000000      # kv only
  block_bytes: 256

chaos:
  duration_s: 180
  inject_at_s: 60            # seconds of steady state before the fault
  concurrency: 100
  target: gcp-1
  recovery_threshold: 0.80

  # Long enough after the fault for the settled-state test (CV < 0.25) to
  # resolve; half of thesis-extended's 900 s to keep the run budget down.
  min_post_fault_s: 450

  # Wait for a demoted primary to become a switchover candidate again; re-cloning
  # 6 GB across a WAN link takes longer than the 300 s default.
  leaseholder_settle_s: 900
  recovery_hold_s: 10
  audit_interval_s: 0.02

  # High-frequency RTO probe (crdblab/core/rto_probe.py). More workers resolve
  # outage edges more finely but add load; both are recorded per run.
  probe_enabled: true
  probe_interval_s: 0.002
  probe_workers: 8
  probe_statement_timeout_ms: 5000
  probe_connect_timeout_s: 2.0
  probe_table: rto_canary

tps_ceiling: 20000
