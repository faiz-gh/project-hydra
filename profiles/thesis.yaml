# Experimental profile for the dissertation sweep.
# Copied verbatim into every run manifest, so a figure can always be traced
# back to the parameters that produced it.
name: thesis

workload:
  # ycsb, not kv: a kv read can only return a key written by the same run
  # process, so a pre-loaded table is unreachable and the effective read working
  # set co-varies with the concurrency being swept (docs/defects.md, D8).
  generator: ycsb
  ycsb_workload: CUSTOM      # holds the original 80/20 mix; A-F also available
  read_freq: 0.8
  update_freq: 0.2
  request_distribution: uniform  # CUSTOM defaults to zipfian, which would
                                 # concentrate load on a hot subset unlike kv
  read_percent: 80           # kv only, retained to reproduce the legacy setup
  duration_s: 60
  warmup_s: 5              # discarded to remove connection ramp-up skew
  display_every_s: 1
  concurrencies: [10, 50, 100, 200]
  repetitions: 3           # single-shot measurement was the weakest point of the
                           # original design; three runs permit interval estimates
  randomise_tier_order: true   # controls for thermal and background drift across a sweep
  cooldown_s: 15           # allows range rebalancing to quiesce between tiers

  # Working set: 125k ycsb rows ~= 205 MB, sized to stay resident in page cache
  # on a 3 GB node so throughput remains CPU- and network-bound and failover is
  # not confounded by storage I/O.
  #
  # seed MUST be identical when loading the table and when running against it.
  # The generator picks a fresh seed per invocation by default, which decouples
  # the loaded keyspace from the queried one: every lookup then matches zero
  # rows and returns in ~3 ms instead of the ~75 ms a real quorum write costs,
  # so the broken configuration reads as an excellent result (docs/defects.md,
  # D8). Verified: matching the seed moves the row-match rate 0.0000 -> 1.0000.
  seed: 42
  insert_count: 125000
  cycle_length: 1000000     # kv only
  block_bytes: 256

chaos:
  duration_s: 180
  inject_at_s: 60          # wall-clock, measured with a monotonic timer
  concurrency: 100
  target: linode-2
  recovery_threshold: 0.80 # single definition, shared by runner and evaluator
  recovery_hold_s: 10
  audit_interval_s: 0.02

  # High-frequency RTO probe: a second, independent client on a background path,
  # measuring how long the database could not serve a write. It is not a faster
  # setting of the audit writer above -- that one is paced for RPO and is
  # deliberately left alone -- but a separate pool of writers against a separate
  # table. See crdblab/core/rto_probe.py.
  #
  # probe_workers is the dial between resolution and perturbation. From the
  # workstation a canary write costs ~370 ms, dominated by the link rather than
  # by the ~70 ms quorum, so the gap between observations is ~370/workers.
  # Measured on the live cluster: 8 workers resolve to 125 ms at 18 writes/s
  # (~5% of a C=100 tier's writes), 24 to 64 ms at 43 writes/s (~12%). Both ends
  # of that trade are recorded per run (events.json -> probe), so the setting can
  # be defended from the data rather than from this comment.
  probe_enabled: true
  probe_interval_s: 0.002
  probe_workers: 8
  probe_statement_timeout_ms: 5000
  probe_connect_timeout_s: 2.0
  probe_table: rto_canary

tps_ceiling: 20000
