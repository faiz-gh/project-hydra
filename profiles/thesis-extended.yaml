# Phase II sweep extended downward, to C=1, so the CockroachDB and PostgreSQL
# runs it produces can be compared at matched throughput -- and, at C=1, in the
# strongest unqueued form at all.
#
# Why this profile exists. A matched-throughput comparison between the two
# engines' Phase II runs requires a load level at which *both* were measured.
# `thesis.yaml`'s tiers are not guaranteed to give one: whichever engine
# saturates at a lower throughput bounds the top of any overlap, and if its
# saturated ceiling sits below the other engine's lowest measured tier, no
# amount of adding tiers at the *high* end closes that gap -- past saturation,
# more workers cost throughput rather than buying it. The only route open is
# tiers at the *low* end, which is what this profile adds.
#
# The added tiers are C = 1, 2, 5. Sweeping down to C=1 is the stronger reason
# to extend this profile: at one worker a closed-loop generator has exactly one
# operation outstanding, so the measured median contains no queueing at all and
# the two engines can be compared without either being confounded by load --
# `engine_comparison.lightest_load_write_latency` is exactly this comparison.
#
# The existing tiers are retained rather than split into a separate run, so the
# whole curve comes from one sweep under one randomised tier order. Two runs
# stitched together would reintroduce exactly the cross-run drift that
# randomisation exists to control, and the analysis layer deliberately has no way
# to merge two runs into one curve.
#
# Every other parameter is identical to `thesis.yaml`. This matters mechanically,
# not just for tidiness: `analysis/validation.py::check_run_comparability` refuses
# to compare two runs whose generator, mix, distribution, seed, insert count,
# duration or warmup differ, so a casual edit here would make a CockroachDB run
# swept under it incomparable with the PostgreSQL run it exists to be compared
# against, or vice versa. Concurrency is deliberately *not* one of those keys --
# differing tiers are the entire point.
name: thesis-extended

workload:
  generator: ycsb
  ycsb_workload: CUSTOM
  read_freq: 0.8
  update_freq: 0.2
  request_distribution: uniform
  read_percent: 80
  duration_s: 60
  warmup_s: 5
  display_every_s: 1

  # The added low tiers are the reason for this profile.
  concurrencies: [1, 2, 5, 10, 50, 100, 200]
  repetitions: 3
  randomise_tier_order: true
  cooldown_s: 15

  # MUST equal the values the table was loaded with. A mismatch does not error:
  # every operation matches zero rows, returns in ~3 ms, and reports roughly
  # twenty times the throughput at a twenty-fifth of the latency
  # (D8).
  seed: 42
  insert_count: 125000
  cycle_length: 1000000
  block_bytes: 256

chaos:
  duration_s: 180
  inject_at_s: 60
  concurrency: 100
  target: gcp-1
  recovery_threshold: 0.80
  recovery_hold_s: 10
  audit_interval_s: 0.02

  # High-frequency RTO probe: a second, independent client on a background path,
  # measuring how long the database could not serve a write. It is not a faster
  # setting of the audit writer above -- that one is paced for RPO and is
  # deliberately left alone -- but a separate pool of writers against a separate
  # table. See crdblab/core/rto_probe.py.
  #
  # probe_workers is the dial between resolution and perturbation. From the
  # workstation a canary write costs ~370 ms, dominated by the link rather than
  # by the ~70 ms quorum, so the gap between observations is ~370/workers.
  # Measured on the live cluster: 8 workers resolve to 125 ms at 18 writes/s
  # (~5% of a C=100 tier's writes), 24 to 64 ms at 43 writes/s (~12%). Both ends
  # of that trade are recorded per run (events.json -> probe), so the setting can
  # be defended from the data rather than from this comment.
  probe_enabled: true
  probe_interval_s: 0.002
  probe_workers: 8
  probe_statement_timeout_ms: 5000
  probe_connect_timeout_s: 2.0
  probe_table: rto_canary

tps_ceiling: 20000
