# thesis.yaml plus tiers C=1, 2 and 5, for matched-throughput and unqueued (C=1)
# comparisons. Everything else must match thesis.yaml or the runs are not comparable.
name: thesis-extended

workload:
  generator: ycsb
  ycsb_workload: CUSTOM
  read_freq: 0.8
  update_freq: 0.2
  request_distribution: uniform
  read_percent: 80
  duration_s: 60
  warmup_s: 5
  display_every_s: 1
  concurrencies: [1, 2, 5, 10, 50, 100, 200]  # the low tiers are the point
  repetitions: 3
  randomise_tier_order: true
  cooldown_s: 15

  # MUST match the values the table was loaded with.
  seed: 42
  insert_count: 3750000
  cycle_length: 1000000
  block_bytes: 256

chaos:
  duration_s: 180
  inject_at_s: 60
  concurrency: 100
  target: gcp-1
  recovery_threshold: 0.80

  # Long enough after the fault for the settled-state test (CV < 0.25) to
  # classify the tail; the fixed window includes the reconnect transient.
  min_post_fault_s: 900
  leaseholder_settle_s: 900
  recovery_hold_s: 10
  audit_interval_s: 0.02
  probe_enabled: true
  probe_interval_s: 0.002
  probe_workers: 8
  probe_statement_timeout_ms: 5000
  probe_connect_timeout_s: 2.0
  probe_table: rto_canary

tps_ceiling: 20000
