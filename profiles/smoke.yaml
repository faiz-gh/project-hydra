# Fast profile for exercising the harness itself, not for producing results.
name: smoke
workload:
  duration_s: 15
  warmup_s: 3
  concurrencies: [10, 50]
  repetitions: 1
  randomise_tier_order: false
  cooldown_s: 5

  # The smoke run loads its own 125k rows. A seed or row count that disagrees
  # with the loaded table makes every lookup match nothing, so keep them paired.
  seed: 42
  insert_count: 125000
chaos:
  duration_s: 45
  inject_at_s: 15
  concurrency: 10
  target: gcp-1
  recovery_threshold: 0.80

  # Counted from the heal in `recover` mode (15 + 45 + 45 = 105 s run). Writes can
  # resume well after the heal, so a shorter window would leave the RTO unmeasured.
  min_post_fault_s: 45

  # The probe runs here too, so the self-test exercises the real path; two
  # workers are enough to prove it works.
  probe_enabled: true
  probe_workers: 2
